<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>パンダシューティング30</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
touch-action:none;
}
html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:sans-serif;
background:#111;
color:#fff;
}
.screen{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
}
.hidden{
display:none;
}
h1{
font-size:clamp(28px,7vw,48px);
margin-bottom:15px;
text-align:center;
}
p{
text-align:center;
line-height:1.6;
}
button{
min-width:220px;
min-height:60px;
font-size:22px;
border:none;
border-radius:16px;
background:#2ecc71;
color:#fff;
margin-top:20px;
font-weight:bold;
}
#gameScreen{
background:#1b1b1b;
padding:0;
justify-content:flex-start;
}
#hud{
width:100%;
display:flex;
justify-content:space-between;
padding:12px;
font-size:20px;
font-weight:bold;
background:#222;
}
#gameArea{
position:relative;
width:100%;
height:calc(100vh - 60px);
overflow:hidden;
background:
linear-gradient(#3a7bd5,#00d2ff);
}
.player{
position:absolute;
font-size:48px;
user-select:none;
pointer-events:none;
}
.enemy{
position:absolute;
font-size:34px;
user-select:none;
}
.bullet{
position:absolute;
width:10px;
height:26px;
border-radius:10px;
background:#ffe600;
box-shadow:0 0 10px #fff600;
}
.effect{
position:absolute;
font-size:34px;
pointer-events:none;
animation:pop .35s forwards;
}
@keyframes pop{
0%{transform:scale(.5);opacity:1;}
100%{transform:scale(2);opacity:0;}
}
.rank{
font-size:50px;
font-weight:bold;
margin:20px 0;
color:#ffe600;
}
</style>
</head>
<body>

<div id="startScreen" class="screen">
<h1>🐼 パンダシューティング30 🐼</h1>
<p>
30秒間生き残れ！<br>
パンダをドラッグして移動。<br>
自動で竹ショットを発射！<br>
敵に当たると即ゲームオーバー。<br>
超難易度なので覚悟して挑戦！
</p>
<button id="startBtn">スタート</button>
</div>

<div id="gameScreen" class="screen hidden">
<div id="hud">
<div>スコア: <span id="score">0</span></div>
<div>残り: <span id="time">30</span>秒</div>
</div>
<div id="gameArea"></div>
</div>

<div id="resultScreen" class="screen hidden">
<h1>結果発表</h1>
<div style="font-size:32px;">最終スコア</div>
<div id="finalScore" style="font-size:60px;font-weight:bold;margin:10px 0;"></div>
<div id="rank" class="rank"></div>
<button id="restartBtn">もう一度遊ぶ</button>
</div>

<script>
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");
const gameArea=document.getElementById("gameArea");

const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const finalScore=document.getElementById("finalScore");
const rankEl=document.getElementById("rank");

let player;
let bullets=[];
let enemies=[];
let score=0;
let timeLeft=30;
let running=false;
let spawnTimer;
let bulletTimer;
let gameTimer;
let loopId;

function startGame(){

startScreen.classList.add("hidden");
resultScreen.classList.add("hidden");
gameScreen.classList.remove("hidden");

gameArea.innerHTML="";

score=0;
timeLeft=30;
running=true;

scoreEl.textContent=score;
timeEl.textContent=timeLeft;

player=document.createElement("div");
player.className="player";
player.textContent="🐼";
player.x=window.innerWidth/2;
player.y=window.innerHeight-160;

player.style.left=player.x+"px";
player.style.top=player.y+"px";

gameArea.appendChild(player);

bullets=[];
enemies=[];

bulletTimer=setInterval(shoot,130);

spawnTimer=setInterval(()=>{
spawnEnemy();
if(timeLeft<20) spawnEnemy();
if(timeLeft<10){
spawnEnemy();
spawnEnemy();
}
},250);

gameTimer=setInterval(()=>{
timeLeft--;
timeEl.textContent=timeLeft;

if(timeLeft<=0){
endGame(true);
}
},1000);

gameLoop();
}

function shoot(){
if(!running) return;

const b=document.createElement("div");
b.className="bullet";

b.x=player.x+22;
b.y=player.y;

b.style.left=b.x+"px";
b.style.top=b.y+"px";

gameArea.appendChild(b);
bullets.push(b);
}

function spawnEnemy(){

const e=document.createElement("div");
e.className="enemy";

const types=["💀","👹","☠️","👾","🔥"];
e.textContent=types[Math.floor(Math.random()*types.length)];

e.x=Math.random()*(gameArea.clientWidth-40);
e.y=-40;

e.speed=5+Math.random()*5+(30-timeLeft)*0.25;

e.style.left=e.x+"px";
e.style.top=e.y+"px";

gameArea.appendChild(e);
enemies.push(e);
}

function gameLoop(){

if(!running) return;

for(let i=bullets.length-1;i>=0;i--){

const b=bullets[i];
b.y-=12;
b.style.top=b.y+"px";

if(b.y<-30){
b.remove();
bullets.splice(i,1);
continue;
}

for(let j=enemies.length-1;j>=0;j--){

const e=enemies[j];

if(
Math.abs((b.x)-(e.x+15))<28 &&
Math.abs((b.y)-(e.y+15))<28
){

createEffect(e.x,e.y);

b.remove();
e.remove();

bullets.splice(i,1);
enemies.splice(j,1);

score+=10;
scoreEl.textContent=score;
break;
}
}
}

for(let i=enemies.length-1;i>=0;i--){

const e=enemies[i];

const dx=(player.x-e.x);
const dy=(player.y-e.y);
const dist=Math.hypot(dx,dy)||1;

e.x+=(dx/dist)*e.speed*0.75;
e.y+=(dy/dist)*e.speed;

e.style.left=e.x+"px";
e.style.top=e.y+"px";

if(
Math.abs((player.x+20)-(e.x+15))<30 &&
Math.abs((player.y+20)-(e.y+15))<30
){
endGame(false);
return;
}

if(e.y>gameArea.clientHeight+50){
e.remove();
enemies.splice(i,1);
}
}

loopId=requestAnimationFrame(gameLoop);
}

function createEffect(x,y){
const fx=document.createElement("div");
fx.className="effect";
fx.textContent="💥";
fx.style.left=x+"px";
fx.style.top=y+"px";
gameArea.appendChild(fx);

setTimeout(()=>fx.remove(),350);
}

function endGame(clear){

running=false;

cancelAnimationFrame(loopId);
clearInterval(spawnTimer);
clearInterval(bulletTimer);
clearInterval(gameTimer);

finalScore.textContent=score;

let rank="C";

if(score>=200) rank="B";
if(score>=500) rank="A";
if(score>=900) rank="S";
if(score>=1400) rank="SS";
if(score>=2000) rank="SSS";

rankEl.textContent=clear ? rank+" ★" : "GAME OVER";

gameScreen.classList.add("hidden");
resultScreen.classList.remove("hidden");
}

let dragging=false;

function movePlayer(clientX,clientY){

if(!player||!running) return;

const rect=gameArea.getBoundingClientRect();

let x=clientX-rect.left-24;
let y=clientY-rect.top-24;

x=Math.max(0,Math.min(rect.width-50,x));
y=Math.max(40,Math.min(rect.height-60,y));

player.x=x;
player.y=y;

player.style.left=x+"px";
player.style.top=y+"px";
}

gameArea.addEventListener("pointerdown",(e)=>{
dragging=true;
movePlayer(e.clientX,e.clientY);
});

gameArea.addEventListener("pointermove",(e)=>{
if(dragging){
movePlayer(e.clientX,e.clientY);
}
});

window.addEventListener("pointerup",()=>{
dragging=false;
});

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("restartBtn").addEventListener("click",startGame);
</script>

</body>
</html>
